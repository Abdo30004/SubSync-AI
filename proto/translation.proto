syntax = "proto3";
package translation;

option go_package = "github.com/subtitle-sync/go-worker/internal/pb/translationpb";

service TranslationService {
  rpc TranslateBlocks (TranslationRequest) returns (TranslationResponse) {}
  rpc TranscribeAudio (TranscribeRequest) returns (TranscribeResponse) {}
}

message TranslationRequest {
  repeated string text_blocks = 1;
  string source_language = 2;
  string target_language = 3;
}

message TranslationResponse {
  repeated string translated_blocks = 1;
}

message TranscribeRequest {
  string audio_path = 1;
}

message WhisperSegment {
  double start = 1;
  double end = 2;
  string text = 3;
}

message TranscribeResponse {
  repeated WhisperSegment segments = 1;
  string detected_language = 2;
}
